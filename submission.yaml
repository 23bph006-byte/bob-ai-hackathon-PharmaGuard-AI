submission:
  title: "PharmaGuard AI: AI-Powered Pharmacovigilance and Regulatory Submission Readiness Platform"

  problem_statement: >
    Pharmacovigilance teams need to identify potential drug safety signals from
    adverse-event reports and assess regulatory submission readiness efficiently.
    Manual analysis can be time-consuming and may make it difficult to prioritize
    safety signals and identify missing CTD documentation.

  solution_summary: >
    PharmaGuard AI is a Streamlit-based platform that combines statistical drug
    safety signal detection using PRR and chi-square analysis with CTD regulatory
    submission readiness assessment and an IBM watsonx.ai Granite-powered AI
    Copilot for interpreting the analysis and generating safety and regulatory
    summaries.

  key_features:
    - "Drug safety signal detection using PRR and chi-square disproportionality analysis"
    - "CTD-based regulatory submission readiness assessment"
    - "IBM watsonx.ai Granite-powered AI Copilot"
    - "Executive summaries combining safety and regulatory findings"
    - "Rule-based fallback mode when AI API credentials are unavailable"

  tech_stack:
    languages:
      - "Python"
    frameworks:
      - "Streamlit"
    ibm_technologies:
      - "IBM watsonx.ai"
      - "IBM Granite"
      - "IBM Cloud IAM"
      - "IBM Bob"
    databases: []
    other:
      - "pandas"
      - "requests"
      - "GitHub Actions"

  what_we_are_most_proud_of: >
    We are most proud of integrating pharmacovigilance signal detection,
    regulatory submission readiness assessment, and IBM watsonx.ai Granite
    assisted interpretation into one practical prototype while maintaining
    transparent fallback behavior and clear responsible-AI limitations.

  known_limitations: >
    The safety analysis identifies statistical disproportionality and does not
    establish causality. The regulatory readiness score is based only on the
    supplied checklist and is not an official regulatory determination. The
    demonstration dataset is synthetic and substantially smaller than real-world
    pharmacovigilance databases. AI-generated outputs require qualified expert
    review.

